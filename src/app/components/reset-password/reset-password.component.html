<div class="reset-password-container">
  <div class="reset-password-card">
    <div *ngIf="!isSubmitted">
      <h1 class="reset-password-title">Passwort zurücksetzen</h1>
      
      <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm" class="reset-password-form">
        <div class="input-group">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            (ngModelChange)="checkPasswordsMatch()"
            required
            placeholder="Neues Passwort"
            class="form-input"
          />
        </div>
        
        <div class="input-group">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            (ngModelChange)="checkPasswordsMatch()"
            required
            placeholder="Neues Kennwort bestätigen"
            class="form-input"
          />
        </div>
        
        <div *ngIf="!passwordsMatch && confirmPassword" class="error-message">
          Die Passwörter stimmen nicht überein
        </div>
        
        <button 
          type="submit" 
          [disabled]="!resetPasswordForm.valid || !passwordsMatch" 
          class="primary-button">
          Passwort ändern
        </button>
      </form>
    </div>
    
    <div *ngIf="isSubmitted" class="success-message">
      <div class="success-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="32" fill="#444DF2" fill-opacity="0.1"/>
          <path d="M20 32L28 40L44 24" stroke="#444DF2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="success-title">Passwort erfolgreich geändert!</h2>
      <p class="success-text">
        Ihr Passwort wurde erfolgreich zurückgesetzt.
        <br><br>
        Sie werden automatisch zur Anmeldeseite weitergeleitet.
      </p>
    </div>
  </div>
</div>
