<ng-container *ngIf="message">
	<div class="message-item" [class.own-message]="isOwnMessage" [class.edit-mode]="showEditMessage || showEditMessageInput" (mouseleave)="onMouseLeave()">
		<div class="message-avatar">
			<app-svg-images [iconName]="getAvatarSrc()" [width]="'clamp(3.5rem, 5vw, 4.375rem)'" [height]="'clamp(3.5rem, 5vw, 4.375rem)'"></app-svg-images>
		</div>

		<div class="message-content" *ngIf="!showEditMessageInput">
			<div class="message-header">
				<span
					class="sender-name"
					[class.clickable]="senderClickable"
					(click)="onSenderNameClick($event)"
				>{{ getSenderName() }}</span>
				<span class="message-time">{{ getTime() }}</span>
				<span class="edited-label" *ngIf="message.isEdited">(bearbeitet)</span>
			</div>

			<div class="message-bubble">
				<p [innerHTML]="getFormattedContent()"></p>
			</div>

			<div class="message-reactions" *ngIf="showReactions">
				<div
					class="reaction-badge-wrapper"
					*ngFor="let reaction of getVisibleReactions(); trackBy: trackByEmoji"
				>
					<button
						type="button"
						class="reaction-badge"
						[class.has-reacted]="reaction.hasReacted"
						(click)="toggleReaction(reaction.emoji)"
					>
						<ng-container [ngSwitch]="reaction.emoji">
							<app-svg-images *ngSwitchCase="'check'" [iconName]="'green_mack'" [width]="'20'" [height]="'20'"></app-svg-images>
							<app-svg-images *ngSwitchCase="'✅'" [iconName]="'green_mack'" [width]="'20'" [height]="'20'"></app-svg-images>
							<app-svg-images *ngSwitchCase="'nice'" [iconName]="'nice'" [width]="'20'" [height]="'20'"></app-svg-images>
							<app-svg-images *ngSwitchCase="'🚀'" [iconName]="'nice'" [width]="'20'" [height]="'20'"></app-svg-images>
							<span *ngSwitchDefault>{{ reaction.emoji }}</span>
						</ng-container>
						{{ reaction.count }}
					</button>
					<div class="reaction-tooltip">
						<ng-container [ngSwitch]="reaction.emoji">
							<app-svg-images *ngSwitchCase="'check'" [iconName]="'green_mack'" [width]="'40'" [height]="'40'" class="tooltip-emoji-icon"></app-svg-images>
							<app-svg-images *ngSwitchCase="'✅'" [iconName]="'green_mack'" [width]="'40'" [height]="'40'" class="tooltip-emoji-icon"></app-svg-images>
							<app-svg-images *ngSwitchCase="'nice'" [iconName]="'nice'" [width]="'40'" [height]="'40'" class="tooltip-emoji-icon"></app-svg-images>
							<app-svg-images *ngSwitchCase="'🚀'" [iconName]="'nice'" [width]="'40'" [height]="'40'" class="tooltip-emoji-icon"></app-svg-images>
							<span *ngSwitchDefault class="tooltip-emoji">{{ reaction.emoji }}</span>
						</ng-container>
						<span class="tooltip-name-row">
							<span class="tooltip-name">{{ getReactionUserName(reaction) }}</span>
							<span class="tooltip-du" *ngIf="showDuSuffix(reaction)">(du)</span>
						</span>
						<span class="tooltip-text">hat reagiert</span>
					</div>
				</div>
				<button
					*ngIf="hasHiddenReactions() && !reactionsExpanded"
					type="button"
					class="reaction-expand-btn"
					(click)="toggleReactionsExpanded()"
				>
					+{{ getHiddenReactionsCount() }} weitere
				</button>
				<button
					*ngIf="reactionsExpanded && hasHiddenReactions()"
					type="button"
					class="reaction-collapse-btn"
					(click)="toggleReactionsExpanded()"
				>
					Weniger anzeigen
				</button>
			</div>

			<button *ngIf="showThreadButton && message.replies?.length" class="thread-reply-btn" (click)="threadClicked.emit()">
				<span class="reply-count">
					{{ message.replies.length }}
					{{ message.replies.length === 1 ? 'Antwort' : 'Antworten' }}
				</span>
				<span class="last-reply-time">Letzte Antwort {{ getLastReplyTime() }}</span>
			</button>
		</div>

		
		<app-hover-reaction-bar
			*ngIf="!showEditMessageInput"
			[isOwnMessage]="isOwnMessage"
			[showThreadButton]="showThreadButton"
			[showCommentButton]="showCommentButton"
			(reactionToggled)="toggleReaction($event)"
			(moreVertClicked)="onMoreVertClick()"
			(threadButtonClicked)="threadClicked.emit()">
		</app-hover-reaction-bar>
		<div class="edit-message-container" *ngIf="isOwnMessage" [class.show]="showEditMessage" [class.thread-edit]="!showThreadButton">
			<button (click)="openEditMessageInput()" class="edit-message">
				Nachricht bearbeiten
			</button>
		</div>
		
		<div class="message-item-spacer" *ngIf="isOwnMessage && showEditMessageInput" [class.show-edit-input]="showEditMessageInput" [class.thread-spacer]="!showThreadButton">
			<div class="message-spacer">
				<app-user-tag-dropdown
					[showTagList]="showTagList"
					[tagListType]="tagListType"
					[users]="users"
					[channels]="channels"
					(userSelected)="tagUser($event)"
					(channelSelected)="tagChannel($event)">
				</app-user-tag-dropdown>
				<div
					#editTextarea
					class="edit-textarea"
					contenteditable="true"
					(input)="onEditInput($event)"
					(click)="onMentionClick($event)"
				></div>
				<div class="edit-message-actions">
					<div class="left-actions">
						<button class="btn-emoji" (click)="toggleEditEmojiPicker()">
							<app-svg-images [iconName]="'smiley'" [width]="'20'" [height]="'20'"></app-svg-images>
						</button>
						<div class="edit-emoji-picker" *ngIf="showEditEmojiPicker">
							<button
								type="button"
								class="edit-emoji-btn"
								*ngFor="let emoji of editEmojis"
								(click)="insertEditEmoji(emoji)"
							>
								{{ emoji }}
							</button>
						</div>
					</div>
					<div class="right-actions">
					<button class="btn-cancel" (click)="hideEditMessageInput()">
					Abbrechen
					</button>
				<button class="btn-save" (click)="saveEditMessage()">
					Speichern
				</button>
				</div>
				</div>
			</div>
		</div>
	</div>
</ng-container>
