<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Anmeldung</h1>
    <p class="login-subtitle">Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.5 5.83333L10 10.8333L17.5 5.83333M3.33333 15.8333H16.6667C17.5871 15.8333 18.3333 15.0871 18.3333 14.1667V5.83333C18.3333 4.91286 17.5871 4.16667 16.6667 4.16667H3.33333C2.41286 4.16667 1.66667 4.91286 1.66667 5.83333V14.1667C1.66667 15.0871 2.41286 15.8333 3.33333 15.8333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="beispielname@email.com"
          class="form-input"
        />
      </div>
      
      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.8333 9.16667V5.83333C15.8333 4.45262 14.714 3.33333 13.3333 3.33333H6.66667C5.28595 3.33333 4.16667 4.45262 4.16667 5.83333V9.16667M15.8333 9.16667H4.16667M15.8333 9.16667V14.1667C15.8333 15.5474 14.714 16.6667 13.3333 16.6667H6.66667C5.28595 16.6667 4.16667 15.5474 4.16667 14.1667V9.16667M10 12.5V12.5083M7.5 9.16667H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Passwort"
          class="form-input"
        />
      </div>
      
      <a href="#" class="forgot-password-link">Passwort vergessen?</a>
      
      <div class="divider">
        <span>ODER</span>
      </div>
      
      <button type="button" (click)="onGoogleLogin()" class="google-login-button">
        <app-svg-images iconName="google" width="20" height="20" className="google-icon"></app-svg-images>
        <span>Anmelden mit Google</span>
      </button>
      
      <button type="submit" [disabled]="!loginForm.valid" class="primary-login-button">
        Anmelden
      </button>
      
      <button type="button" routerLink="/dashboard" class="guest-login-button">
        Gäste-Login
      </button>
    </form>
  </div>
</div>
