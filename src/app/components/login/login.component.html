<div class="login-container">
  <div class="login-header">
    <button routerLink="/signup" class="signup-link-button">Sign Up</button>
  </div>
  <div class="login-card">
    <h2>Login</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
        />
      </div>
      <button type="submit" [disabled]="!loginForm.valid" class="submit-button">
        Login
      </button>
    </form>
    <div class="guest-login-section">
      <div class="divider">
        <span>or</span>
      </div>
      <button routerLink="/dashboard" class="guest-button">
        Continue as Guest
      </button>
    </div>
  </div>
</div>
