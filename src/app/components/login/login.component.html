<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Anmeldung</h1>
    <p class="login-subtitle">Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.</p>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.5 5.83333L10 10.8333L17.5 5.83333M3.33333 15.8333H16.6667C17.5871 15.8333 18.3333 15.0871 18.3333 14.1667V5.83333C18.3333 4.91286 17.5871 4.16667 16.6667 4.16667H3.33333C2.41286 4.16667 1.66667 4.91286 1.66667 5.83333V14.1667C1.66667 15.0871 2.41286 15.8333 3.33333 15.8333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="beispielname@email.com"
          class="form-input"
        />
      </div>
      
      <div class="input-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.8333 9.16667V5.83333C15.8333 4.45262 14.714 3.33333 13.3333 3.33333H6.66667C5.28595 3.33333 4.16667 4.45262 4.16667 5.83333V9.16667M15.8333 9.16667H4.16667M15.8333 9.16667V14.1667C15.8333 15.5474 14.714 16.6667 13.3333 16.6667H6.66667C5.28595 16.6667 4.16667 15.5474 4.16667 14.1667V9.16667M10 12.5V12.5083M7.5 9.16667H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Passwort"
          class="form-input"
        />
      </div>
      
      <a href="#" class="forgot-password-link">Passwort vergessen?</a>
      
      <div class="divider">
        <span>ODER</span>
      </div>
      
      <button type="button" (click)="onGoogleLogin()" class="google-login-button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="google-icon">
          <path d="M19.6 10.2273C19.6 9.51818 19.5364 8.83636 19.4182 8.18182H10V12.05H15.3818C15.15 13.3 14.4455 14.3591 13.3864 15.0682V17.5773H16.6182C18.5091 15.8364 19.6 13.2727 19.6 10.2273Z" fill="#4285F4"/>
          <path d="M10 20C12.7 20 14.9636 19.1045 16.6182 17.5773L13.3864 15.0682C12.4909 15.6682 11.3455 16.0227 10 16.0227C7.39545 16.0227 5.19091 14.2636 4.40455 11.9H1.06364V14.4909C2.70909 17.7591 6.09091 20 10 20Z" fill="#34A853"/>
          <path d="M4.40455 11.9C4.20455 11.3 4.09091 10.6591 4.09091 10C4.09091 9.34091 4.20455 8.7 4.40455 8.1V5.50909H1.06364C0.386364 6.85909 0 8.38636 0 10C0 11.6136 0.386364 13.1409 1.06364 14.4909L4.40455 11.9Z" fill="#FBBC05"/>
          <path d="M10 3.97727C11.4682 3.97727 12.7864 4.48182 13.8227 5.47273L16.6909 2.60455C14.9591 0.990909 12.6955 0 10 0C6.09091 0 2.70909 2.24091 1.06364 5.50909L4.40455 8.1C5.19091 5.73636 7.39545 3.97727 10 3.97727Z" fill="#EA4335"/>
        </svg>
        <span>Anmelden mit Google</span>
      </button>
      
      <button type="submit" [disabled]="!loginForm.valid" class="primary-login-button">
        Anmelden
      </button>
      
      <button type="button" routerLink="/dashboard" class="guest-login-button">
        Gäste-Login
      </button>
    </form>
  </div>
</div>
