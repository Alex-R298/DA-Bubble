<div class="choose-avatar-container">
  <app-header-login></app-header-login>
  <div class="decorative-curve"></div>
  <div class="choose-avatar-card">
    <h1 class="choose-avatar-title">Wähle deinen Avatar</h1>
    <p class="choose-avatar-subtitle">{{ userName }}</p>
    
    <div class="avatar-preview">
      <div class="avatar-circle">
        <svg *ngIf="selectedAvatar === null" width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="44" cy="44" r="44" fill="#6F7CEB"/>
          <path d="M44 44C38.95 44 34.7917 42.2542 31.525 38.7625C28.2583 35.2708 26.625 31.075 26.625 26.175C26.625 21.275 28.2583 17.0792 31.525 13.5875C34.7917 10.0958 38.95 8.35 44 8.35C49.05 8.35 53.2083 10.0958 56.475 13.5875C59.7417 17.0792 61.375 21.275 61.375 26.175C61.375 31.075 59.7417 35.2708 56.475 38.7625C53.2083 42.2542 49.05 44 44 44ZM77 79.65H11C9.5375 79.65 8.29583 79.1292 7.275 78.0875C6.25417 77.0458 5.74375 75.7792 5.74375 74.2875V69.7875C5.74375 67.9292 6.2725 66.2125 7.33 64.6375C8.3875 63.0625 9.78125 61.85 11.5125 61C15.425 58.85 19.4208 57.2017 23.5 56.055C27.5792 54.9083 31.75 54.335 36.0125 54.335C36.4625 54.335 36.8942 54.3533 37.3075 54.39C37.7208 54.4267 38.1525 54.4817 38.6025 54.555C37.7025 55.8217 36.9842 57.2017 36.4475 58.695C35.9108 60.1883 35.6058 61.7633 35.5325 63.42C35.4592 65.0767 35.5692 66.6517 35.8625 68.145C36.1558 69.6383 36.5508 71.125 37.0475 72.605H50.9525C51.4492 71.125 51.8442 69.6383 52.1375 68.145C52.4308 66.6517 52.5408 65.0767 52.4675 63.42C52.3942 61.7633 52.0892 60.1883 51.5525 58.695C51.0158 57.2017 50.2975 55.8217 49.3975 54.555C49.8475 54.4817 50.2792 54.4267 50.6925 54.39C51.1058 54.3533 51.5375 54.335 51.9875 54.335C56.25 54.335 60.4208 54.9083 64.5 56.055C68.5792 57.2017 72.575 58.85 76.4875 61C78.2188 61.85 79.6125 63.0625 80.67 64.6375C81.7275 66.2125 82.2562 67.9292 82.2562 69.7875V74.2875C82.2562 75.7792 81.7458 77.0458 80.725 78.0875C79.7042 79.1292 78.4625 79.65 77 79.65Z" fill="white"/>
        </svg>
        <app-svg-images 
          *ngIf="selectedAvatar !== null" 
          [iconName]="avatars[selectedAvatar]" 
          [width]="'176'" 
          [height]="'176'"
          className="selected-avatar-svg">
        </app-svg-images>
      </div>
    </div>

    <p class="avatar-instruction">Aus der Liste wählen</p>

    <div class="avatars-grid">
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 0"
        (click)="selectAvatar(0)">
        <app-svg-images iconName="steffen-hoffmann" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 1"
        (click)="selectAvatar(1)">
        <app-svg-images iconName="sofia-mueller" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 2"
        (click)="selectAvatar(2)">
        <app-svg-images iconName="noah-braun" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 3"
        (click)="selectAvatar(3)">
        <app-svg-images iconName="frederik-beck" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 4"
        (click)="selectAvatar(4)">
        <app-svg-images iconName="elise-roth" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
      <div 
        class="avatar-option"
        [class.selected]="selectedAvatar === 5"
        (click)="selectAvatar(5)">
        <app-svg-images iconName="elias-neumann" [width]="'72'" [height]="'72'"></app-svg-images>
      </div>
    </div>

    <button 
      class="primary-button" 
      [disabled]="selectedAvatar === null"
      (click)="onContinue()">
      Weiter
    </button>
  </div>
</div>
