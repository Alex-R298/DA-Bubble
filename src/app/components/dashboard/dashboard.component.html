<div class="chat-layout-container">
	<app-sidebar></app-sidebar>

	<div class="chat-area">
		<router-outlet></router-outlet>
	</div>

	@if (selectedMessageId) {
	<div class="thread-area">
		<app-thread [parentMessageId]="selectedMessageId" [channelId]="selectedChannelId"
			[parentMessage]="selectedMessage" (threadClosed)="closeThread()">
		</app-thread>
	</div>
	}
</div>
