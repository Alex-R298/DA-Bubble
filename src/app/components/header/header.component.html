<header class="header">
  <div class="logo-area">
    (img)
  </div>

  <div class="header-right">
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Devspace durchsuchen"
        [(ngModel)]="searchQuery"
      />
      <span class="search-icon">(img)</span>
    </div>

    <div class="user-area">
      <div class="user-info" (click)="toggleUserMenu()">
        <span class="user-name">{{ userProfile?.name || 'User' }}</span>
        <img
          [src]="userProfile?.profileImageUrl || ''"
          alt="Profilbild"
          class="user-avatar"
        />
        <span class="dropdown-arrow">{{ showUserMenu ? '▲' : '▼' }}</span>
      </div>

      <div class="user-dropdown" *ngIf="showUserMenu">
        <button class="dropdown-item" (click)="openProfile()">
          <span></span>
          <p>Profil</p>
        </button>

        <a class="dropdown-item" routerLink="/privacy" (click)="closeUserMenu()">
          <span></span>
          <p>Datenschutz</p>
        </a>

        <a class="dropdown-item" routerLink="/imprint" (click)="closeUserMenu()">
          <span></span>
          <p>Impressum</p>
        </a>

        <button class="dropdown-item logout" (click)="onLogout()">
          <span></span>
          <p>Abmelden</p>
        </button>
      </div>
    </div>
  </div>
</header>
