<header class="header">
  <div class="logo-area">
    (img)
  </div>

  <div class="header-right">
    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Devspace durchsuchen"
        [(ngModel)]="searchQuery"
      />
      <span class="search-icon">(img)</span>
    </div>

    <div class="user-area">
      <div class="user-info" (click)="toggleUserMenu()">
        <span class="user-name">{{ userProfile?.name || 'User' }}</span>
        <div class="user-avatar-wrapper">
          <img
            [src]="userProfile?.profileImageUrl || ''"
            alt="Profilbild"
            class="user-avatar"
          />
          <span class="status-indicator" [ngClass]="getStatusClass(userProfile)"></span>
        </div>
        <span class="dropdown-arrow">{{ showUserMenu ? '▲' : '▼' }}</span>
      </div>

      <div class="user-dropdown" *ngIf="showUserMenu">
        <button class="dropdown-item" (click)="openProfile()">
          <span></span>
          <p>Profil</p>
        </button>

        <button class="dropdown-item logout" (click)="onLogout()">
          <span></span>
          <p>Log out</p>
        </button>
      </div>
    </div>
  </div>
</header>
