<ng-container *ngIf="isVisible">
  <div class="modal-overlay display-center-center dim" (click)="onOverlayClick()"></div>

  <div class="modal" [ngClass]="activeType" (click)="onModalClick($event)">
    <!-- Channel Info Modal -->
    <ng-container *ngIf="activeType === 'channel-info'">
      <div class="modal-header">
        <div class="title-row display-ai-center-jc-spacebetween">
          <div class="title-left display-ai-center">
            <app-svg-images class="hash" [iconName]="'tag'" [width]="'100%'" [height]="'100%'"></app-svg-images>
            <span class="title">{{ channel?.name }}</span>
          </div>
          <button type="button" class="ui-btn-icon-round display-center-center" (click)="close()" aria-label="Close">
            <app-svg-images [iconName]="'close'" [width]="'24'" [height]="'24'" [className]="'icon-colored'"></app-svg-images>
          </button>
        </div>
      </div>

      <div class="modal-body display-flex-column">
        <div class="section display-flex-column">
          <div class="channel-name-group display-flex-column" [class.has-border]="!isEditingName">
            <div class="section">
              <div class="section-head display-ai-center-jc-spacebetween mb-20px">
                <span class="label">Channel-Name</span>
                <button type="button" class="ui-btn-link" (click)="isEditingName ? saveName() : startEditName()">
                  {{ isEditingName ? 'Speichern' : 'Bearbeiten' }}
                </button>
              </div>

                <div class="value display-ai-center channel-name-value">
                  <ng-container *ngIf="isEditingName; else nameView">
                    <div class="ui-input-with-prefix">
                      <app-svg-images class="ui-input-prefix" [iconName]="'tag'" [width]="'100%'"></app-svg-images>
                      <input class="ui-input-rounded" [(ngModel)]="draftName" />
                    </div>
                  </ng-container>
                  <ng-template #nameView>
                    <app-svg-images [iconName]="'tag'" [width]="'17'" [height]="'16'"></app-svg-images>
                    <span>{{ channel?.name }}</span>
                  </ng-template>
                </div>
            </div>
          </div>
          <div class="description-group display-flex-column" [class.has-border]="!isEditingDescription">
            <div class="section">
              <div class="section-head display-ai-center-jc-spacebetween mb-20px">
                <span class="label">Beschreibung</span>
                <button type="button" class="ui-btn-link" (click)="isEditingDescription ? saveDescription() : startEditDescription()">
                  {{ isEditingDescription ? 'Speichern' : 'Bearbeiten' }}
                </button>
              </div>
              <div class="value">
                <input *ngIf="isEditingDescription" class="ui-input-rounded" [(ngModel)]="draftDescription">
                <span *ngIf="!isEditingDescription">{{ channel?.description }}</span>
              </div>
            </div>

            <div class="divider"></div>

            <div class="created-by display-flex-column">
              <span class="label">Erstellt von</span>
              <span class="value created-by-name">{{ createdByName }}</span>
            </div>
          </div>
        </div>

        <div class="leave-actions display-jc-flexend">
          <button type="button" class="ui-btn-primary" (click)="leaveChannel()">Channel verlassen</button>
        </div>
      </div>
    </ng-container>

    <!-- Members Modal -->
    <ng-container *ngIf="activeType === 'members'">
      <div class="modal-header">
        <div class="title-row display-ai-center-jc-spacebetween">
          <span class="title">Mitglieder</span>
          <button type="button" class="ui-btn-icon-round display-center-center" (click)="close()" aria-label="Close">
            <app-svg-images [iconName]="'close'" [width]="'24'" [height]="'24'" [className]="'icon-colored'"></app-svg-images>
          </button>
        </div>
      </div>

      <div class="modal-body">
        <div class="members-list display-flex-column">
          <div class="member display-ai-center gap-15px ml-20px" *ngFor="let user of memberUsers" (click)="openMemberProfile(user)">
            <div class="ui-avatar-badge member-avatar" style="--ui-avatar-badge-size: 3.57rem;">
              <app-svg-images
                [iconName]="user?.profileImageUrl || 'steffen-hoffmann'"
                [width]="'100%'"
                [height]="'100%'"
                [className]="'avatar-icon'"
              ></app-svg-images>
              <span class="ui-status-indicator" [ngClass]="getStatusClass(user)"></span>
            </div>
            <span class="name">{{ getMemberLabel(user) }}</span>
          </div>
        </div>

        <button type="button" class="btn-add-members display-flex-row display-ai-center gap-15px" (click)="openAddMembers()">
          <app-svg-images class="add-member-btn display-center-center" [iconName]="'add_members'" [width]="'24'" [height]="'24'"></app-svg-images>
          Mitglieder hinzufügen</button>
      </div>
    </ng-container>

    <!-- Add Members Modal -->
    <ng-container *ngIf="activeType === 'add-members'">
      <div class="modal-header">
        <div class="title-row display-ai-center-jc-spacebetween">
          <span class="title">Leute hinzufügen</span>
          <button type="button" class="ui-btn-icon-round display-center-center" (click)="close()" aria-label="Close">
            <app-svg-images [iconName]="'close'" [width]="'24'" [height]="'24'" [className]="'icon-colored'"></app-svg-images>
          </button>
        </div>
      </div>

      <div class="modal-body">
        <div class="channel-name display-ai-center">
          <app-svg-images class="hash" [iconName]="'tag'" [width]="'100%'" [height]="'100%'"></app-svg-images>
          <span>{{ channel?.name }}</span>
        </div>

        <div class="chip-input">
          <div class="chips">
            <div class="chip display-ai-center" *ngFor="let u of selectedUsers">
              <app-svg-images
                class="user-avatar add-member-avatar"
                [iconName]="u?.profileImageUrl || 'steffen-hoffmann'"
                [width]="'100%'"
                [height]="'100%'">
                </app-svg-images>
              <span class="chip-name">{{ u.name }}</span>
              <button type="button" class="chip-remove" (click)="removeSelectedUser(u.uid)">×</button>
            </div>

            <input
              class="member-input"
              type="text"
              [(ngModel)]="addMemberQuery"
              placeholder="Name oder E-Mail"
            />
          </div>

          <div class="suggestions" *ngIf="filteredSelectableUsers.length">
            <button
              type="button"
              class="suggestion"
              *ngFor="let user of filteredSelectableUsers"
              (mousedown)="addUserToSelection(user); $event.preventDefault()"
            >
              <app-svg-images
                class="user-avatar add-member-avatar"
                [iconName]="user?.profileImageUrl || 'steffen-hoffmann'"
                [width]="'100%'"
                [height]="'100%'">
              </app-svg-images>
              <span class="name">{{ user.name }}</span>
            </button>
          </div>
        </div>

        <div class="actions display-jc-flexend">
          <button type="button" class="ui-btn-primary" [disabled]="!canConfirmAddMembers" (click)="confirmAddMembers()">
            Hinzufügen
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</ng-container>
