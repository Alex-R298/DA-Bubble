<div class="signup-container">
  <app-header-signup></app-header-signup>
  <div class="decorative-curve"></div>
  <div class="signup-card">
    <h1 class="signup-title">{{ 'SIGNUP.TITLE' | translate }}</h1>
    <p class="signup-subtitle">{{ 'SIGNUP.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="signup-form">
      <div class="input-group">
        <div class="input-icon">
          <app-svg-images iconName="person" [width]="'20'" [height]="'20'"></app-svg-images>
        </div>
        <input type="text" id="displayName" name="displayName" [(ngModel)]="displayName" required
          #nameInput="ngModel" [placeholder]="'SIGNUP.NAME_PLACEHOLDER' | translate" class="form-input"
          [class.input-error]="submitted && !isNameValid()" />
      </div>
      <div *ngIf="submitted && !isNameValid()" class="validation-message-name">
        <span *ngIf="!displayName.trim()">Name ist erforderlich.</span>
        <span *ngIf="displayName.trim() && !isNameValid()">Bitte Vor- und Nachname eingeben.</span>
      </div>

      <div class="input-group">
        <div class="input-icon">
          <app-svg-images iconName="mail" [width]="'20'" [height]="'16'"></app-svg-images>
        </div>
        <input type="email" id="email" name="email" [(ngModel)]="email" required #emailInput="ngModel"
          autocomplete="email" [placeholder]="'SIGNUP.EMAIL_PLACEHOLDER' | translate" class="form-input"
          [class.input-error]="submitted && !isEmailValid()" />
      </div>
      <div *ngIf="submitted && !isEmailValid()" class="validation-message-email">
        <span *ngIf="!email.trim()">E-Mail ist erforderlich.</span>
        <span *ngIf="email.trim() && !isEmailValid()">Ungültige E-Mail-Adresse.</span>
      </div>

      <!-- <div class="input-group">
        <div class="input-icon">
          <app-svg-images iconName="mail" [width]="'20'" [height]="'16'"></app-svg-images>
        </div>
        <input type="email" id="confirmEmail" name="confirmEmail" [(ngModel)]="confirmEmail" required
          #confirmEmailInput="ngModel" autocomplete="off" [placeholder]="'E-Mail bestätigen'" class="form-input"
          [class.input-error]="(confirmEmailInput.invalid || !checkEmailsMatch()) && (confirmEmailInput.dirty || confirmEmailInput.touched)" />
      </div>
      <div
        *ngIf="(confirmEmailInput.invalid || !checkEmailsMatch()) && (confirmEmailInput.dirty || confirmEmailInput.touched)"
        class="validation-message">
        <span *ngIf="confirmEmailInput.errors?.['required']">Bestätigung erforderlich.</span>
        <span *ngIf="!confirmEmailInput.errors && !checkEmailsMatch()">E-Mails stimmen nicht überein.</span>
      </div> -->

      <div class="input-group">
        <div class="input-icon">
          <app-svg-images iconName="lock" [width]="'16'" [height]="'21'"></app-svg-images>
        </div>
        <input type="password" id="password" name="password" [(ngModel)]="password" required
          #passwordInput="ngModel" autocomplete="new-password" [placeholder]="'SIGNUP.PASSWORD_PLACEHOLDER' | translate"
          class="form-input"
          [class.input-error]="submitted && !isPasswordValid()" />
      </div>
      <div *ngIf="submitted && !isPasswordValid()" class="validation-message-password">
        <span *ngIf="!password">Passwort ist erforderlich.</span>
        <span *ngIf="password && !isPasswordValid()">Mindestens 6 Zeichen.</span>
      </div>

      <div class="checkbox-group">
        <div class="checkbox-wrapper-30">
          <span class="checkbox">
            <input type="checkbox" id="privacy" name="privacy" [(ngModel)]="privacyAccepted" required />
            <svg>
              <use href="#checkbox-30" class="checkbox"></use>
            </svg>
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
            <symbol id="checkbox-30" viewBox="0 0 22 22">
              <path fill="none" stroke="currentColor"
                d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2" />
            </symbol>
          </svg>
        </div>
        <label for="privacy" class="checkbox-label">
          {{ 'SIGNUP.PRIVACY_AGREEMENT' | translate }} <a routerLink="/privacy-policy" (click)="onPrivacyLinkClick()"
            class="privacy-link">{{ 'SIGNUP.PRIVACY_POLICY' | translate }}</a> {{ 'SIGNUP.PRIVACY_AGREEMENT_END' |
          translate }}
        </label>
      </div>

      <button type="submit" [disabled]="!privacyAccepted" class="primary-button">
        {{ 'SIGNUP.CONTINUE' | translate }}
      </button>
    </form>
  </div>

  <app-overlay [isVisible]="showOverlay" [type]="overlayType" [title]="overlayTitle" [message]="overlayMessage"
    (close)="onOverlayClose()">
  </app-overlay>
</div>
