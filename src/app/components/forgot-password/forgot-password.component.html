<div class="forgot-password-container">
  <button class="back-button" (click)="goBack()">
    <app-svg-images iconName="arrow_back" [width]="'1rem'" [height]="'1rem'"></app-svg-images>
  </button>
  <div class="decorative-curve"></div>
  <div class="forgot-password-card">
    <div *ngIf="!isSubmitted">
      <h1 class="forgot-password-title">Passwort zurücksetzen</h1>
      <p class="forgot-password-subtitle">
        Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen deines Passworts.
      </p>
      
      <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm" class="forgot-password-form">
        <div class="input-group">
          <div class="input-icon">
            <app-svg-images iconName="mail" [width]="'20'" [height]="'16'"></app-svg-images>
          </div>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="beispielname@email.com"
            class="form-input"
          />
        </div>
        
        <button 
          type="submit" 
          [disabled]="!forgotPasswordForm.valid" 
          class="primary-button">
          Link senden
        </button>
        
        <a routerLink="/login" class="back-to-login">
          Zurück zur Anmeldung
        </a>
      </form>
    </div>
    
    <div *ngIf="isSubmitted" class="success-message">
      <div class="success-icon">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="32" fill="#444DF2" fill-opacity="0.1"/>
          <path d="M20 32L28 40L44 24" stroke="#444DF2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="success-title">E-Mail gesendet!</h2>
      <p class="success-text">
        Wir haben dir einen Link zum Zurücksetzen deines Passworts an <strong>{{ email }}</strong> gesendet.
        <br><br>
        Bitte überprüfe auch deinen Spam-Ordner.
      </p>
      <button (click)="goBack()" class="back-button-inline">
        Zurück zur Anmeldung
      </button>
    </div>
  </div>
</div>
